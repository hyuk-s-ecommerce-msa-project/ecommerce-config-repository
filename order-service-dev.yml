spring:
  datasource:
    shard0:
      url: jdbc:mariadb://localhost:3306/gameinfo_order
    shard1:
      url: jdbc:mariadb://localhost:3306/gameinfo_order2
    hikari:
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 180000
      connection-timeout: 5000
  rabbitmq:
    host: localhost
    port: 5672
  kafka:
    bootstrap-servers: 127.0.0.1:9093
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        use_id_generator_strategy_three_lo: false
        format_sql: false
        dialect: org.hibernate.dialect.MariaDBDialect

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        include:
          - health
          - beans
          - info
          - busrefresh
          - prometheus
          - metrics

gateway:
  ip: 127.0.0.1, ::1, 192.168.219.100

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id}:${random.value}
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka